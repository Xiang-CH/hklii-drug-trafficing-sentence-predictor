name: Build and deploy predictor backend to Azure Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './predictorBackend'
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: predictorBackend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: pnpm install --frozen-lockfile

      - name: Build backend
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: pnpm build

      - name: Test backend
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: pnpm test

      - name: Prepare Azure Functions package
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          rm -rf azure-package
          mkdir azure-package
          cp package.json pnpm-lock.yaml host.json azure-package/
          cp -R dist azure-package/dist
          pnpm --dir azure-package install --prod --frozen-lockfile
          test -f azure-package/host.json
          test -f azure-package/dist/functions/httpTrigger.js

      - name: Zip deployment package
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/azure-package
        run: zip -r ../release.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictor-backend
          path: predictorBackend/release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: predictor-backend

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: sentencing-predictor-backend
          package: release.zip
          publish-profile: ${{ secrets.__publishingprofilesecretname__ }}
          sku: flexconsumption
